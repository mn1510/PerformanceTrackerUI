<div class="pyramid-viz" *ngIf="pyramidData">
  <div *ngIf="isEmpty" class="empty-state">
    <p>No data for selected filters</p>
  </div>

  <div *ngIf="!isEmpty">
    <!-- Chart.js Canvas -->
    <div class="chart-container">
      <canvas
        baseChart
        [data]="barChartData"
        [options]="barChartOptions"
        type="bar"
        [legend]="barChartLegend"
        height="400">
      </canvas>
    </div>

    <!-- Metadata summary -->
    <div class="metadata">
      <p><strong>Onsights:</strong> {{ getTotalOnsights() }}</p>
      <p><strong>Flashes:</strong> {{ getTotalFlashes() }}</p>
      <p><strong>Redpoints:</strong> {{ getTotalRedpoints() }}</p>
      <p><strong>Total:</strong> {{ pyramidData.metadata.total_ascents }} ascents</p>
    </div>
  </div>
</div>
